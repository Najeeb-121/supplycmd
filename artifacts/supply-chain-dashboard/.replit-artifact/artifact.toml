kind = "web"
previewPath = "/"
title = "Supply Chain & Manufacturing Dashboard"
version = "1.0.0"
id = "artifacts/supply-chain-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21927

[services.development]
run = "pnpm --filter @workspace/supply-chain-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/supply-chain-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/supply-chain-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21927"
BASE_PATH = "/"
