openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Supply Chain & Manufacturing Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Inventory management
  - name: suppliers
    description: Supplier management
  - name: production
    description: Production runs and metrics
  - name: demand
    description: Demand planning and forecasting
  - name: orders
    description: Purchase orders
  - name: dashboard
    description: Dashboard KPI aggregates
  - name: integrations
    description: Third-party ERP integrations (Odoo)
  - name: auth
    description: Account signup, login, and session management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- Auth ---
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new company and its first (owner) user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Created — session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in — session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and clear the session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user, if any
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  # --- Inventory ---
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List all inventory items
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: warehouse
          in: query
          schema: { type: string }
        - name: supplier
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: archived
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/relationships:
    get:
      operationId: getInventoryRelationships
      tags: [inventory]
      summary: List verified product-supplier relationships
      responses:
        "200":
          description: Product-supplier relationships with provenance and active inbound details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRelationship"

  /inventory/reorder-alerts:
    get:
      operationId: getReorderAlerts
      tags: [inventory]
      summary: Items with verified reservation shortages
      responses:
        "200":
          description: Operational stock alerts caused by reservation shortages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReorderAlert"

  /inventory/reorder-suggestions:
    get:
      operationId: getReorderSuggestions
      tags: [inventory]
      summary: Reorder suggestions with recommended order quantities
      responses:
        "200":
          description: Reorder suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReorderSuggestion"

  /inventory/kpis:
    get:
      operationId: getInventoryKpis
      tags: [inventory]
      summary: Inventory KPI summary (value, counts, turnover)
      responses:
        "200":
          description: Inventory KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryKpis"

  /inventory/movements:
    get:
      operationId: listStockMovements
      tags: [inventory]
      summary: List all stock movements
      parameters:
        - name: inventoryItemId
          in: query
          schema: { type: number }
        - name: movementType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"

  /inventory/{id}:
    get:
      operationId: getInventoryItem
      tags: [inventory]
      summary: Get inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /inventory/{id}/movements:
    post:
      operationId: createStockMovement
      tags: [inventory]
      summary: Record a stock movement for an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  # --- Suppliers ---
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List all suppliers
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # --- Production ---
  /production:
    get:
      operationId: listProductionRuns
      tags: [production]
      summary: List production runs
      responses:
        "200":
          description: List of production runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionRun"
    post:
      operationId: createProductionRun
      tags: [production]
      summary: Create production run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"

  /production/{id}:
    patch:
      operationId: updateProductionRun
      tags: [production]
      summary: Update production run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionRunUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRun"

  /production/metrics/oee:
    get:
      operationId: getOeeMetrics
      tags: [production]
      summary: OEE and production KPIs aggregated
      responses:
        "200":
          description: OEE metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OeeMetrics"

  # --- Demand ---
  /demand:
    get:
      operationId: listDemandRecords
      tags: [demand]
      summary: List demand records
      responses:
        "200":
          description: List of demand records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemandRecord"
    post:
      operationId: createDemandRecord
      tags: [demand]
      summary: Create demand record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandRecord"

  /demand/forecast:
    get:
      operationId: getDemandForecast
      tags: [demand]
      summary: Demand forecast with MAPE and MAD metrics per product
      responses:
        "200":
          description: Forecast results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastResult"

  # --- Orders ---
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List purchase orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # --- Dashboard ---
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Top-level KPI summary across all domains
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/inventory-health:
    get:
      operationId: getInventoryHealth
      tags: [dashboard]
      summary: Inventory health breakdown with turnover, DOS, and stock status counts
      responses:
        "200":
          description: Inventory health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryHealth"

  /dashboard/logistics-kpis:
    get:
      operationId: getLogisticsKpis
      tags: [dashboard]
      summary: Logistics KPIs including fill rate and OTIF
      responses:
        "200":
          description: Logistics KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsKpis"

  # --- Odoo integration ---
  /integrations/odoo/test-connection:
    post:
      operationId: testOdooConnection
      tags: [integrations]
      summary: Test the configured Odoo connection
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooConnectionStatus"

  /integrations/odoo/sync/suppliers:
    post:
      operationId: syncOdooSuppliers
      tags: [integrations]
      summary: Pull vendor contacts from Odoo into the suppliers table
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"

  /integrations/odoo/sync/inventory:
    post:
      operationId: syncOdooInventory
      tags: [integrations]
      summary: Pull products from Odoo into the inventory_items table
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"

  /integrations/odoo/sync/logistics:
    post:
      operationId: syncOdooLogistics
      tags: [integrations]
      summary: Pull stock movements from Odoo into the stock_movements table
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"

  /integrations/odoo/sync/production:
    post:
      operationId: syncOdooProduction
      tags: [integrations]
      summary: Pull manufacturing orders from Odoo into the production_runs table
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"

  /integrations/odoo/sync/planning:
    post:
      operationId: syncOdooPlanning
      tags: [integrations]
      summary: Pull demand history from Odoo sales orders into the demand_records table
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooSyncResult"

  /integrations/odoo/sync-log:
    get:
      operationId: getOdooSyncLog
      tags: [integrations]
      summary: Recent Odoo sync history, newest first
      responses:
        "200":
          description: Sync log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OdooSyncLogEntry"

  /integrations/odoo/connection:
    get:
      operationId: getOdooConnection
      tags: [integrations]
      summary: Get this company's saved Odoo connection info (never returns the API key)
      responses:
        "200":
          description: Connection info, or connected=false if none saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooConnectionInfo"
    put:
      operationId: saveOdooConnection
      tags: [integrations]
      summary: Test and save this company's Odoo connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OdooConnectionInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooConnectionInfo"
        "400":
          description: Connection test failed — not saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooConnectionInfo"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # --- Auth ---
    SignupInput:
      type: object
      required: [companyName, name, email, password]
      properties:
        companyName: { type: string }
        name:        { type: string }
        email:       { type: string }
        password:    { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:    { type: string }
        password: { type: string }

    AuthUser:
      type: object
      required: [id, email, name, role, companyId, companyName]
      properties:
        id:          { type: number }
        email:       { type: string }
        name:        { type: string }
        role:        { type: string }
        companyId:   { type: number }
        companyName: { type: string }

    # --- Inventory ---
    InventoryRelationship:
      type: object
      required: [supplierId, supplierOdooId, supplierName, productId, productOdooId, productName, sku, activePoCount, inboundQty, hasActivePo, relationshipSource]
      properties:
        supplierId:        { type: number }
        supplierOdooId:    { type: number, nullable: true }
        supplierName:      { type: string }
        productId:         { type: number }
        productOdooId:     { type: number, nullable: true }
        productName:       { type: string }
        sku:               { type: string }
        activePoCount:     { type: number }
        inboundQty:        { type: number }
        hasActivePo:       { type: boolean }
        relationshipSource:
          type: string
          enum: [product_supplier, purchase_order_line, both]

    InventoryItem:
      type: object
      required: [id, name, sku, category, unitOfMeasure, currentStock, reservedQuantity, availableQuantity, rawAvailableQuantity, reservationShortage, incomingQuantity, minStock, annualDemand, annualDemandSource, holdingCostRate, holdingCostRateSource, orderingCost, orderingCostSource, leadTimeDays, leadTimeSource, reorderPoint, reorderPointSource, safetyStock, safetyStockSource, eoq, eoqSource, unitCost, archived, createdAt]
      properties:
        id:               { type: number }
        name:             { type: string }
        sku:              { type: string }
        barcode:          { type: string }
        description:      { type: string }
        category:         { type: string }
        subcategory:      { type: string }
        brand:            { type: string }
        unitOfMeasure:    { type: string }
        warehouse:        { type: string }
        binLocation:      { type: string }
        supplierName:     { type: string }
        unitCost:         { type: number }
        sellingPrice:     { type: number }
        currentStock:     { type: number }
        reservedQuantity: { type: number }
        availableQuantity:    { type: number }
        rawAvailableQuantity: { type: number }
        reservationShortage:  { type: number }
        incomingQuantity:     { type: number }
        minStock:         { type: number }
        maxStock:         { type: number }
        annualDemand:          { type: number, nullable: true }
        annualDemandSource:    { type: string }
        holdingCostRate:       { type: number, nullable: true }
        holdingCostRateSource: { type: string }
        orderingCost:          { type: number, nullable: true }
        orderingCostSource:    { type: string }
        leadTimeDays:          { type: number, nullable: true }
        leadTimeSource:        { type: string }
        reorderPoint:          { type: number, nullable: true }
        reorderPointSource:    { type: string }
        safetyStock:           { type: number, nullable: true }
        safetyStockSource:     { type: string }
        eoq:                   { type: number, nullable: true }
        eoqSource:             { type: string }
        archived:         { type: boolean }
        createdAt:        { type: string }

    InventoryItemInput:
      type: object
      required: [name, sku, category, currentStock, unitCost]
      properties:
        name:             { type: string }
        sku:              { type: string }
        barcode:          { type: string }
        description:      { type: string }
        category:         { type: string }
        subcategory:      { type: string }
        brand:            { type: string }
        unitOfMeasure:    { type: string }
        warehouse:        { type: string }
        binLocation:      { type: string }
        supplierName:     { type: string }
        currentStock:     { type: number }
        reservedQuantity: { type: number }
        minStock:         { type: number }
        maxStock:         { type: number }
        leadTimeDays:     { type: number, nullable: true }
        unitCost:         { type: number }
        sellingPrice:     { type: number }
        annualDemand:     { type: number, nullable: true }
        holdingCostRate:  { type: number, nullable: true }
        orderingCost:     { type: number, nullable: true }

    InventoryItemUpdate:
      type: object
      properties:
        name:             { type: string }
        barcode:          { type: string }
        description:      { type: string }
        category:         { type: string }
        subcategory:      { type: string }
        brand:            { type: string }
        unitOfMeasure:    { type: string }
        warehouse:        { type: string }
        binLocation:      { type: string }
        supplierName:     { type: string }
        currentStock:     { type: number }
        reservedQuantity: { type: number }
        minStock:         { type: number }
        maxStock:         { type: number }
        leadTimeDays:     { type: number, nullable: true }
        unitCost:         { type: number }
        sellingPrice:     { type: number }
        annualDemand:     { type: number, nullable: true }
        holdingCostRate:  { type: number, nullable: true }
        orderingCost:     { type: number, nullable: true }
        archived:         { type: boolean }

    ReorderAlert:
      type: object
      required: [id, name, sku, currentStock, availableQuantity, reservationShortage, incomingQuantity, reason]
      properties:
        id:                  { type: number }
        name:                { type: string }
        sku:                 { type: string }
        currentStock:        { type: number }
        availableQuantity:   { type: number }
        reservationShortage: { type: number }
        incomingQuantity:    { type: number }
        reason:              { type: string, enum: [RESERVATION_SHORTAGE] }
    ReorderSuggestion:
      type: object
      required: [id, name, sku, currentStock, availableQuantity, reservationShortage, incomingQuantity, safetyStock, reorderPoint, eoq, recommendedOrderQty, planningStatus, reason, priority, warehouse, supplierName]
      properties:
        id:                  { type: number }
        name:                { type: string }
        sku:                 { type: string }
        currentStock:        { type: number }
        availableQuantity:   { type: number }
        reservationShortage: { type: number }
        incomingQuantity:    { type: number }
        safetyStock:         { type: number, nullable: true }
        reorderPoint:        { type: number, nullable: true }
        eoq:                 { type: number, nullable: true }
        recommendedOrderQty: { type: number, nullable: true }
        planningStatus:      { type: string, enum: [NOT_DETERMINABLE] }
        reason:              { type: string, enum: [RESERVATION_SHORTAGE] }
        priority:            { type: string, enum: [high, medium, low] }
        warehouse:           { type: string }
        supplierName:        { type: string }

    InventoryKpis:
      type: object
      required: [totalValue, totalSkus, lowStockCount, criticalCount, outOfStockCount, overstockCount, avgTurnoverRate, avgDaysOnHand]
      properties:
        totalValue:       { type: number }
        totalSkus:        { type: number }
        lowStockCount:    { type: number }
        criticalCount:    { type: number }
        outOfStockCount:  { type: number }
        overstockCount:   { type: number }
        avgTurnoverRate: { type: number, nullable: true }
        avgDaysOnHand:   { type: number, nullable: true }

    StockMovement:
      type: object
      required: [id, inventoryItemId, movedAt, user, movementType, action, quantityBefore, quantityChanged, quantityAfter]
      properties:
        id:               { type: number }
        inventoryItemId:  { type: number }
        movedAt:          { type: string, nullable: true }
        user:             { type: string, nullable: true }
        movementType:     { type: string, nullable: true }
        action:           { type: string }
        referenceNumber:  { type: string }
        reason:           { type: string }
        warehouse:        { type: string }
        quantityBefore:   { type: number, nullable: true }
        quantityChanged:  { type: number }
        quantityAfter:    { type: number, nullable: true }

    StockMovementInput:
      type: object
      required: [movementType, action, quantityChanged, user]
      properties:
        movementType:    { type: string }
        action:          { type: string }
        referenceNumber: { type: string }
        reason:          { type: string }
        warehouse:       { type: string }
        quantityChanged: { type: number }
        user:            { type: string }

    # --- Suppliers ---
    Supplier:
      type: object
      required: [id, name, country, leadTimeDays, onTimeDeliveryRate, qualityScore, fillRate, createdAt]
      properties:
        id:                  { type: number }
        name:                { type: string }
        country:             { type: string, nullable: true }
        leadTimeDays:        { type: number, nullable: true }
        onTimeDeliveryRate:  { type: number, nullable: true }
        qualityScore:        { type: number, nullable: true }
        fillRate:            { type: number, nullable: true }
        createdAt:           { type: string }

    SupplierInput:
      type: object
      required: [name, country]
      properties:
        name:                { type: string }
        country:             { type: string }
        leadTimeDays:        { type: number, nullable: true }
        onTimeDeliveryRate:  { type: number, nullable: true }
        qualityScore:        { type: number, nullable: true }
        fillRate:            { type: number, nullable: true }

    SupplierUpdate:
      type: object
      properties:
        name:                { type: string }
        country:             { type: string }
        leadTimeDays:        { type: number, nullable: true }
        onTimeDeliveryRate:  { type: number, nullable: true }
        qualityScore:        { type: number, nullable: true }
        fillRate:            { type: number, nullable: true }

    # --- Production ---
    ProductionRun:
      type: object
      required: [id, productName, plannedUnits, actualUnits, plannedTimeMin, actualTimeMin, defects, downtimeMin, runDate, createdAt]
      properties:
        id:             { type: number }
        productName:    { type: string }
        plannedUnits:   { type: number }
        actualUnits:    { type: number }
        plannedTimeMin: { type: number, nullable: true }
        actualTimeMin:  { type: number, nullable: true }
        defects:        { type: number, nullable: true }
        downtimeMin:    { type: number, nullable: true }
        runDate:        { type: string, nullable: true }
        createdAt:      { type: string }

    ProductionRunInput:
      type: object
      required: [productName, plannedUnits, actualUnits, plannedTimeMin, actualTimeMin, defects, downtimeMin, runDate]
      properties:
        productName:    { type: string }
        plannedUnits:   { type: number }
        actualUnits:    { type: number }
        plannedTimeMin: { type: number }
        actualTimeMin:  { type: number }
        defects:        { type: number }
        downtimeMin:    { type: number }
        runDate:        { type: string }

    ProductionRunUpdate:
      type: object
      properties:
        actualUnits:    { type: number }
        actualTimeMin:  { type: number, nullable: true }
        defects:        { type: number, nullable: true }
        downtimeMin:    { type: number, nullable: true }

    OeeMetrics:
      type: object
      required: [oeePercent, availabilityPercent, performancePercent, qualityPercent, avgTaktTimeSec, avgCycleTimeSec, throughputPerHour, totalRuns]
      properties:
        oeePercent:           { type: number, nullable: true }
        availabilityPercent:  { type: number, nullable: true }
        performancePercent:   { type: number, nullable: true }
        qualityPercent:       { type: number, nullable: true }
        avgTaktTimeSec:       { type: number, nullable: true }
        avgCycleTimeSec:      { type: number, nullable: true }
        throughputPerHour:    { type: number, nullable: true }
        totalRuns:            { type: number }

        # --- Demand ---
    DemandRecord:
      type: object
      required: [id, productName, period, source, createdAt]
      properties:
        id:                { type: number }
        productName:       { type: string }
        period:            { type: string }
        source:            { type: string }
        actualDemand:      { type: [number, "null"] }
        forecastedDemand:  { type: [number, "null"] }
        replenishmentQty:  { type: [number, "null"] }
        createdAt:         { type: string }

    DemandRecordInput:
      type: object
      required: [productName, period, actualDemand, forecastedDemand]
      properties:
        productName:       { type: string }
        period:            { type: string }
        actualDemand:      { type: number }
        forecastedDemand:  { type: number }

    ForecastResult:
      type: object
      required: [productName, mape, mad, forecastAccuracy, nextPeriodForecast, trend]
      properties:
        productName:        { type: string }
        mape:               { type: number }
        mad:                { type: number }
        forecastAccuracy:   { type: number }
        nextPeriodForecast: { type: number }
        trend:              { type: string, enum: [up, down, stable] }

    # --- Orders ---
    Order:
      type: object
      required: [id, supplierId, supplierName, totalValue, status, orderDate, expectedDelivery, itemCount, createdAt]
      properties:
        id:               { type: number }
        supplierId:       { type: number }
        supplierName:     { type: string }
        totalValue:       { type: number }
        status:           { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
        orderDate:        { type: string }
        expectedDelivery: { type: string }
        actualDelivery:   { type: ["string", "null"] }
        itemCount:        { type: number }
        createdAt:        { type: string }

    OrderInput:
      type: object
      required: [supplierId, totalValue, orderDate, expectedDelivery, itemCount]
      properties:
        supplierId:       { type: number }
        totalValue:       { type: number }
        orderDate:        { type: string }
        expectedDelivery: { type: string }
        itemCount:        { type: number }

    OrderUpdate:
      type: object
      properties:
        status:         { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
        actualDelivery: { type: string }
        totalValue:     { type: number }

    # --- Dashboard ---
    DashboardSummary:
      type: object
      required: [totalSkus, totalInventoryValue, reorderAlertCount, activeSuppliers, openOrders, pendingOrderValue, oeePercent, forecastAccuracy, fillRate, otifPercent]
      properties:
        totalSkus:           { type: number }
        totalInventoryValue: { type: number }
        reorderAlertCount:   { type: number }
        activeSuppliers:     { type: number }
        openOrders:          { type: number }
        pendingOrderValue:   { type: number }
        oeePercent:          { type: number, nullable: true }
        forecastAccuracy:    { type: number, nullable: true }
        fillRate:            { type: number, nullable: true }
        otifPercent:         { type: number, nullable: true }

    InventoryHealth:
      type: object
      required: [avgTurnoverRate, avgDaysOfSupply, overstockCount, stockoutCount, healthyCount, categoryBreakdown]
      properties:
        avgTurnoverRate: { type: number, nullable: true }
        avgDaysOfSupply: { type: number, nullable: true }
        overstockCount:  { type: number }
        stockoutCount:   { type: number }
        healthyCount:    { type: number }
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdown"

    CategoryBreakdown:
      type: object
      required: [category, count, value, avgTurnover]
      properties:
        category:    { type: string }
        count:       { type: number }
        value:       { type: number }
        avgTurnover: { type: number, nullable: true }

    LogisticsKpis:
      type: object
      required: [fillRate, otifPercent, avgLeadTimeDays, avgSupplierScore, ordersDeliveredOnTime, ordersFulfilled, totalOrders]
      properties:
        fillRate:               { type: number, nullable: true }
        otifPercent:            { type: number, nullable: true }
        avgLeadTimeDays:        { type: number, nullable: true }
        avgSupplierScore:       { type: number, nullable: true }
        ordersDeliveredOnTime:  { type: number }
        ordersFulfilled:        { type: number }
        totalOrders:            { type: number }

    # --- Odoo integration ---
    OdooConnectionStatus:
      type: object
      required: [connected]
      properties:
        connected:   { type: boolean }
        odooVersion: { type: ["string", "null"] }
        error:       { type: ["string", "null"] }

    OdooSyncResult:
      type: object
      required: [synced, failed, errors]
      properties:
        synced: { type: number }
        failed: { type: number }
        errors:
          type: array
          items: { type: string }

    OdooSyncLogEntry:
      type: object
      required: [id, entity, status, recordsSynced, recordsFailed, syncedAt]
      properties:
        id:            { type: number }
        entity:        { type: string, enum: [suppliers, inventory] }
        status:        { type: string, enum: [success, partial, error] }
        recordsSynced: { type: number }
        recordsFailed: { type: number }
        message:       { type: ["string", "null"] }
        syncedAt:      { type: string }

    OdooConnectionInput:
      type: object
      required: [url, db, username, apiKey]
      properties:
        url:      { type: string }
        db:       { type: string }
        username: { type: string }
        apiKey:   { type: string }

    OdooConnectionInfo:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        url:       { type: ["string", "null"] }
        db:        { type: ["string", "null"] }
        username:  { type: ["string", "null"] }
        error:     { type: ["string", "null"] }
