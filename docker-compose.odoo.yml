services:
  odoo-db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
  odoo:
    image: odoo:17
    depends_on: [odoo-db]
    ports: ["8069:8069"]
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
volumes:
  odoo-db-data:
  odoo-data:
